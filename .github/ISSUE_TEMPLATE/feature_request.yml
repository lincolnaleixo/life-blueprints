name: Blueprint improvement
description: Propose a reusable capability, phase, or new business type
title: "[Proposal]: "
body:
  - type: textarea
    id: gap
    attributes:
      label: Reusable gap
      description: Explain the recurring business condition that the current catalog misses.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence across implementations
      description: Show why this is generic rather than a project needed by only one business.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Propose the smallest phase, capability, or guidance change that closes the gap.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Explain whether this is editorial, backward-compatible, or breaking.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Proposal checks
      options:
        - label: This is a durable condition, not a temporary project or task.
          required: true
        - label: The proposal contains no private-system context.
          required: true
