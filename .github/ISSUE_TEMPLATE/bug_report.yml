name: Blueprint correction
description: Report an incorrect claim, broken reference, or validation defect
title: "[Correction]: "
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private business data, or identifying internal context.
  - type: dropdown
    id: blueprint
    attributes:
      label: Blueprint
      options:
        - affiliates
        - content
        - ebooks
        - ecommerce
        - mobile-app
        - newsletter
        - saas
        - social-media
        - utility-site
        - youtube
        - repository tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify the incorrect or unclear material and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence
      description: Link primary public sources or provide a reproducible validator failure.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed private or sensitive information.
          required: true
